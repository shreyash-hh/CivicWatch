{% extends 'base.html' %}
{% load static %}

{% block title %}CivicWatch :: Session Terminated{% endblock %}

{% block content %}
<div class="main-container" style="max-width: 480px; margin-top: 4rem; margin-bottom: 4rem;">
    <div class="modern-card text-center" style="padding: 2.5rem 1.5rem;">
        <div style="width: 64px; height: 64px; border-radius: 50%; background-color: #F1F5F9; color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; font-size: 1.75rem; margin-bottom: 1.25rem;">
            <i class="fas fa-right-from-bracket"></i>
        </div>
        <h1 style="font-size: 1.5rem; margin: 0 0 0.5rem 0;">Session Terminated</h1>
        <p class="text-muted" style="font-size: 0.875rem; margin-bottom: 1.75rem;">You have securely logged out of the CivicWatch municipal registry platform.</p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
            <a href="{% url 'login' %}" class="btn-modern btn-modern-primary">
                <i class="fas fa-arrow-right-to-bracket me-1"></i> Sign In Again
            </a>
            <a href="{% url 'home' %}" class="btn-modern btn-modern-secondary">
                <i class="fas fa-map-location-dot me-1"></i> Live Map Explorer
            </a>
        </div>
    </div>
</div>
{% endblock %}
